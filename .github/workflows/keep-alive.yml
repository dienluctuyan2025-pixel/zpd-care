name: Keep Render API Awake

on:
  schedule:
    # Chạy mỗi 14 phút (Render free tier ngủ sau 15 phút không hoạt động)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Cho phép chạy thủ công từ tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API Health
        run: curl -s https://zpd-care-api.onrender.com/api/health > /dev/null
